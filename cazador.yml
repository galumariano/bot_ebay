name: Cazador de ofertas eBay

on:
  schedule:
    # Cada hora, en el minuto 0. Los horarios son UTC.
    - cron: '7,37 * * * *'
    # Latido diario: 12:00 UTC = 9:00 de la manana en Argentina
    - cron: '12 12 * * *'
  # Boton para correrlo a mano desde la pestana Actions
  workflow_dispatch:

# Necesario para que el bot pueda guardar vistos.json en el repo
permissions:
  contents: write

jobs:
  cazar:
    runs-on: ubuntu-latest

    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar el cazador
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # El latido se activa solo en la corrida de las 12:00 UTC
          LATIDO: ${{ github.event.schedule == '0 12 * * *' && '1' || '0' }}
        run: python cazador_ebay_cloud.py

      - name: Guardar los listados ya vistos
        run: |
          git config user.name "cazador-bot"
          git config user.email "bot@users.noreply.github.com"
          git add vistos.json
          # Si no hubo cambios, no falla
          git diff --staged --quiet || git commit -m "Actualizar vistos [skip ci]"
          # Reintenta si otra corrida escribio primero
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
